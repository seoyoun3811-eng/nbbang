name: nbbang
description: N빵 정산 앱
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0   # 즐겨찾기, 계좌 저장
  image_picker: ^1.1.2         # 사진 촬영, 갤러리 선택
  google_mlkit_text_recognition: ^0.13.1 # 영수증 글자 인식 (한국어)
  share_plus: ^10.1.1          # 공유 시트로 카톡/문자 보내기
  firebase_core: ^5.2.0
  firebase_ai: ^5.2.0
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
